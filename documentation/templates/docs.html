{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Docs</title>

    <link rel="stylesheet" href="{% static 'style.css' %}" />
    <link rel="stylesheet" href="{% static 'codehilite.css' %}" />
    <link rel="stylesheet" href="{% static 'copybutton.css' %}">
  </head>
  <body>
    <a href="{% url 'docs' %}">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="icon-book"
        >
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path
            d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z"
          ></path>
        </svg>
    </a>

    <div class="markdown-body">{{ markdown_file|safe }}</div>
  </body>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      document.querySelectorAll("div.codehilite").forEach(function (codeBlock) {
        var button = document.createElement("button");
        button.className = "copy-button";
        button.type = "button";
        button.innerText = "Copy";
        button.addEventListener("click", function () {
          var code = codeBlock.querySelector("pre").innerText;
          navigator.clipboard.writeText(code).then(
            function () {
              button.innerText = "Copied!";
              setTimeout(() => (button.innerText = "Copy"), 1500);
            },
            function () {
              button.innerText = "Error";
            }
          );
        });

        codeBlock.appendChild(button);
      });
    });
  </script>
</html>
